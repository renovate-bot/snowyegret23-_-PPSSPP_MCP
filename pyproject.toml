[project]
name = "ppsspp-mcp"
version = "0.1.0"
description = "MCP server for PPSSPP WebSocket debugger and process memory inspection"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "psutil>=5.9",
]

[project.optional-dependencies]
xinput = [
    "vgamepad==0.1.0",
]

[project.scripts]
ppsspp-mcp = "ppsspp_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppsspp_mcp"]
